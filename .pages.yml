# Pages CMS - Wijkraad Koningshaven
# Beheer op https://app.pagescms.org/ voor de branch main.
# Nieuws met een ingevuld 'event' verschijnt automatisch ook in de agenda.

media:
  - name: uploads
    label: Afbeeldingen voor nieuws
    input: public/uploads
    output: /uploads
    categories: [image]
    rename: safe

  - name: albumfotos
    label: Foto's voor albums
    input: public/uploads/albums
    output: /uploads/albums
    categories: [image]
    rename: safe

  - name: documenten
    label: PDF-documenten
    input: public/uploads
    output: /uploads
    extensions: [pdf]
    rename: safe

content:
  - name: nieuws
    label: Nieuws, artikelen en agenda
    type: collection
    path: src/content/nieuws
    format: yaml-frontmatter
    filename: "{primary}.md"
    operations:
      rename: false # Bestaande links naar artikelen blijven zo geldig.
    view:
      fields: [title, date, draft, description]
      primary: title
      sort: [date, title]
      search: [title, description, tags]
      default:
        sort: date
        order: desc
    fields:
      - name: draft
        label: Concept (nog niet publiceren)
        description: "AAN = onzichtbaar op de website en in de agenda. UIT = gepubliceerd. Nieuwe artikelen beginnen als concept."
        type: boolean
        default: true

      - name: title
        label: Titel
        type: string
        required: true

      - name: description
        label: Korte samenvatting
        description: Wordt getoond in de nieuwsoverzichten en zoekresultaten.
        type: text
        required: true

      - name: date
        label: Publicatiedatum
        type: date
        required: true
        options:
          format: yyyy-MM-dd

      - name: image
        label: Omslagfoto (optioneel)
        type: image
        options:
          media: uploads

      - name: imageAlt
        label: Beschrijving van de omslagfoto
        description: Beschrijf wat op de foto te zien is, voor toegankelijkheid.
        type: string

      - name: tags
        label: Onderwerpen / tags
        type: string
        list: true

      - name: event
        label: Agendapunt (optioneel)
        description: Laat dit leeg voor gewoon nieuws. Vul een startdatum in om het bericht ook in de agenda te tonen.
        type: object
        fields:
          - name: start
            label: Start (datum en tijd)
            type: date
            required: true
            default: ""
            options:
              time: true
              format: "yyyy-MM-dd'T'HH:mm:ssXXX"

          - name: end
            label: Einde (optioneel)
            type: date
            default: ""
            options:
              time: true
              format: "yyyy-MM-dd'T'HH:mm:ssXXX"

          - name: location
            label: Locatie / adres
            type: string

          - name: description
            label: Korte agendaomschrijving
            type: text

      - name: body
        label: Artikeltekst
        description: Schrijf hier het volledige bericht. Afbeeldingen kun je direct in de tekst invoegen.
        type: rich-text
        options:
          format: markdown
          media: uploads
          switcher: true

      - name: seo
        label: Zoekmachine-instellingen (optioneel)
        type: object
        fields:
          - name: title
            label: Afwijkende SEO-titel
            type: string
          - name: description
            label: Afwijkende SEO-beschrijving
            type: text
          - name: noindex
            label: Niet opnemen in zoekmachines
            type: boolean
            default: false

  - name: fotoalbums
    label: Fotoalbums
    type: collection
    path: src/content/media
    format: yaml-frontmatter
    filename: "{primary}.md"
    operations:
      rename: false # Bestaande albumlinks blijven zo geldig.
    view:
      fields: [title, description]
      primary: title
      sort: [title]
      search: [title, description]
    fields:
      - name: title
        label: Titel van het album
        type: string
        required: true

      - name: description
        label: Korte beschrijving
        type: text
        required: true

      - name: images
        label: Foto's in het album
        description: Voeg per foto een afbeelding en beschrijving toe. Gebruik 'Foto's voor albums' bij het uploaden.
        type: object
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: "Foto {index}: {alt}"
        fields:
          - name: src
            label: Afbeelding
            type: image
            required: true
            options:
              media: albumfotos

          - name: alt
            label: Beschrijving van de foto
            description: Beschrijf wat op de afbeelding staat, voor toegankelijkheid.
            type: string
            required: true

settings:
  content:
    merge: true # Behoud onbekende velden bij het bewerken van bestaande berichten.
  commit:
    templates:
      create: "cms: voeg {filename} toe"
      update: "cms: werk {filename} bij"
      delete: "cms: verwijder {filename}"
      rename: "cms: hernoem {oldFilename} naar {newFilename}"
